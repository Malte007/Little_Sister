# Little Sister starten:  docker compose up -d   →   http://<server>:8080
# go2rtc für die Live-Ansicht kommt in Schritt 3 dazu.
services:
  little-sister:
    image: ${LS_IMAGE:-ghcr.io/malte007/little_sister:latest}
    build: .
    container_name: little-sister
    restart: unless-stopped
    # Host-Netzwerk, damit die ONVIF-Kamerasuche (UDP-Multicast) funktioniert.
    # Ohne Suche geht auch Bridge-Netzwerk: network_mode entfernen und "ports: [8080:8080]" setzen.
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./data:/data
      - ./recordings:/recordings
