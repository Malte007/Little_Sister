# Läuft unverändert auf GitHub Actions und Gitea Actions (act_runner).
# Gitea liest .github/workflows, solange es keinen Ordner .gitea/workflows gibt.
#
# Einstellbar über Variablen (Repository-Einstellungen → Actions → Variables):
#   RUNNER_LABEL  Runner-Label, Standard "ubuntu-latest"
#   REGISTRY      Container-Registry, Standard "ghcr.io" (Gitea: z. B. "gitea.local:3000")
#   IMAGE_NAME    Image-Name ohne Registry, Standard "<owner>/<repo>"
# und Secrets (nur nötig, wenn nicht GitHubs eigenes Token genutzt wird):
#   REGISTRY_USERNAME, REGISTRY_PASSWORD
name: CI

# Läuft nur für Versions-Tags (v0.1.1, v0.1.2-test, …): bauen, testen, Docker-Image.
# Commits und Pull Requests lösen nichts aus, um Actions-Minuten zu sparen;
# von Hand startbar unter Actions → CI → "Run workflow" (dann nur bauen und testen).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Statisches ffmpeg (nur ffmpeg + ffprobe, ein Download) statt apt: apt zieht über 100 Pakete und dauert Minuten.
      # Der Download wird zwischengespeichert; ohne Cache-Server (z. B. Gitea ohne Cache) wird er nur jedes Mal geladen.
      - name: ffmpeg aus dem Zwischenspeicher
        id: ffmpeg-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-static-v1-${{ runner.os }}-${{ runner.arch }}
      - name: ffmpeg installieren (für die Aufnahme-Tests)
        run: |
          if command -v ffmpeg >/dev/null; then exit 0; fi
          DIR="$HOME/.local/ffmpeg"
          if [ ! -x "$DIR/ffmpeg" ]; then
            case "$(uname -m)" in aarch64|arm64) ARCH=linuxarm64 ;; *) ARCH=linux64 ;; esac
            mkdir -p "$DIR"
            if ! curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-${ARCH}-gpl.tar.xz" \
                | tar -xJ -C "$DIR" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'; then
              # Rückfall, falls der Download nicht klappt
              SUDO=$(command -v sudo || true)
              $SUDO apt-get update && $SUDO apt-get install -y --no-install-recommends ffmpeg
              exit 0
            fi
          fi
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/ffmpeg" -hide_banner -version | head -1
      - name: go2rtc installieren (für die Live-Tests)
        env:
          GO2RTC_VERSION: '1.9.14'
        run: |
          if ! command -v go2rtc >/dev/null; then
            case "$(uname -m)" in aarch64|arm64) ARCH=arm64 ;; *) ARCH=amd64 ;; esac
            SUDO=$(command -v sudo || true)
            curl -fsSL -o /tmp/go2rtc "https://github.com/AlexxIT/go2rtc/releases/download/v${GO2RTC_VERSION}/go2rtc_linux_${ARCH}"
            $SUDO install -m 755 /tmp/go2rtc /usr/local/bin/go2rtc
          fi
          go2rtc -version
      - name: Bauen und testen
        run: ./scripts/build.sh

  docker:
    needs: build-test
    # Nur für Versions-Tags; sonst wird nur getestet
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      PUSH: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Image-Name und Version bestimmen
        run: |
          echo "IMAGE=${REGISTRY}/${{ vars.IMAGE_NAME || github.repository }}" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # "latest" nur für fertige Versionen; Tags mit Zusatz wie -test bekommen nur ihren eigenen Namen
          if [[ "$VERSION" == *-* ]]; then echo "LATEST=false" >> "$GITHUB_ENV"; else echo "LATEST=true" >> "$GITHUB_ENV"; fi
      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Image bauen und veröffentlichen
        run: ./scripts/docker-build.sh
